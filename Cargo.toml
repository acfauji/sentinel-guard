[package]
name = "sentinel-guard"
version = "0.1.0"
edition = "2021"
description = "Security-first AI-agent governance: action risk analysis, prompt-injection shield, sandbox containment, tamper-evident ledger"
license = "MIT"

[dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
anyhow = "1"

# CLI / TUI
clap = { version = "4", features = ["derive"] }
